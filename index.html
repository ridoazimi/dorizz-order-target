<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<title>Target Order | Dorizz Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <form id="gate" autocomplete="off">
    <h1>Target Order</h1>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" inputmode="text" required>
    <button type="submit">Masuk</button>
    <p id="gate-status" role="alert" aria-live="assertive"></p>
  </form>

  <section id="board" hidden>
    <header>
      <span id="connection" role="status" aria-live="polite">Menghubungkan</span>
      <button id="logout" type="button">Keluar</button>
    </header>
    <p class="caption">Order berhasil</p>
    <p id="total" class="total" aria-live="polite" aria-atomic="true">0</p>
    <div class="bar"><span id="fill"></span></div>
    <p class="meta"><span id="progress">0%</span> dari <span id="target">2.940</span></p>
    <p class="period">29 Sep – 28 Okt 2026 · WIB</p>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
